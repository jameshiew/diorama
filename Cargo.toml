[workspace]
members = ["crates/examples-common"]

[package]
name = "diorama"
version = "0.1.0-dev"
edition = "2024"
license = "MIT-0"

[dependencies]
avian3d = { version = "0.7.0", default-features = false }
bevy = { version = "0.19.1", default-features = false, features = [
  "default_font",
  "bevy_anti_alias",
  "bevy_gizmos",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_post_process",
  "bevy_render",
  "bevy_shader",
  "bevy_state",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "mesh_picking",
  "wayland",
  "x11",
] }
bevy_framepace = { version = "0.22.0", default-features = false }
bevy-inspector-egui = { version = "0.37.0", optional = true }
bevy-tnua = { version = "0.32.0", default-features = false }
bevy-tnua-avian3d = { version = "0.12.1", default-features = false }
leafwing-input-manager = { version = "0.21.0", default-features = false, features = [
  "keyboard",
] }

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  "dynamic_linking",
  "hdr",
  "jpeg",
  "multi_threaded",
  "smaa_luts",
  "tonemapping_luts",
  "zstd_rust",
] }
bevy_asset_loader = { version = "0.27.0" }
bevy_yarnspinner = { version = "0.9.0" }
bevy_yarnspinner_example_dialogue_view = { version = "0.9.0" }
examples-common = { path = "crates/examples-common" }
rand = "0.10"

[features]
default = ["avian3d/parry-f32"]
dev = [
  "bevy_framepace/framepace_debug",
  "inspector",
  "perfui",
  "physics-debug",
  "remote"
]
f64 = ["avian3d/parry-f64", "bevy-tnua-avian3d/f64", "bevy-tnua/f64"]
inspector = ["dep:bevy-inspector-egui"]
perfui = ["bevy/bevy_dev_tools", "bevy/default_font"]
physics-debug = ["avian3d/debug-plugin", "bevy/bevy_gizmos_render"]
remote = ["bevy/bevy_remote"]

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1
